{{ define "main" -}}
<ul class="posts">
  {{ range where .Site.RegularPages "Type" "=" "episode" -}}
  <li>
    <span>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      {{ if isset .Params "tags" }}<span class="tags"
        >[{{ delimit .Params.tags ", " }}]</span
      >{{ end }}
      <time class="pull-right post-list"
        >{{ .Date.Format "Mon, Jan 2, 2006" }}</time
      >
    </span>
  </li>
  {{- end }}
</ul>
{{- end }}
